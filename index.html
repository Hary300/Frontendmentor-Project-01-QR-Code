<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />

    <title>Frontend Mentor | QR code component</title>
  </head>
  <body>
    <div class="card">
      <div class="container">
        <div class="qr-container">
          <img src="./images/myPortQrCode.png" alt="QR code" />
        </div>

        <h1>Check Out My Personal Portfolio</h1>
        <p>
          Scan the QR code to explore my latest projects, skills, and work
          experience.
        </p>
      </div>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="https://github.com/Hary300">Hary300</a>.
      </div>
    </div>
  </body>
</html>
